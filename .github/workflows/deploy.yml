name: Deploy Nexus to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código no robô
        uses: actions/checkout@v3

      - name: Empurrar arquivos para a AWS (Substitui o git pull)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "~/Nexus"

      - name: Executar Faxina e Subir o Sistema
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Nexus
            
            # Faxina preventiva
            sudo docker builder prune -a -f
            sudo docker image prune -a -f
            
            # Sobe o sistema com o código novo recém-copiado
            sudo docker-compose up -d --build