version: '3.8'

services:
  # 1. O Banco de Dados
  nexus-db:
    image: postgres:15
    container_name: nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_super_senha_123}
      POSTGRES_DB: ${DB_NAME:-nexus_db}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data

  # 2. O Backend (API & Machine Learning)
  nexus-api:
    build: ./backend
    container_name: nexus_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - nexus-db
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-nexus_super_senha_123}
      - DB_HOST=nexus-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-nexus_db}
      - SECRET_KEY=${SECRET_KEY:-gerar_uma_chave_segura_em_producao}

  # 3. O Frontend (React via Nginx)
  nexus-web:
    build: ./frontend
    container_name: nexus_frontend
    restart: always
    ports:
      - "80:80" # Vai rodar na porta padrão da internet
    depends_on:
      - nexus-api

volumes:
  nexus_pgdata: